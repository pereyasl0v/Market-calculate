services:
  backend:
    build: ./backend
    environment:
      CORS_ORIGINS: http://localhost:3000
    expose:
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
