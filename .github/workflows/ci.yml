name: Validate Market Calculate
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Test parser and mocked HAR search
        working-directory: backend
        run: python -m pytest -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install React app
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Test HAR import in browser parser
        working-directory: frontend
        run: node --test lib/*.test.mjs
      - name: Validate Chrome extension manifest and script
        run: python -c "import json; [json.load(open(p)) for p in ['extension/wb-capture/manifest.json','extension/ozon-capture/manifest.json']]" && node --check extension/wb-capture/wb-capture.js && node --check extension/ozon-capture/ozon-capture.js
      - name: Build Next.js
        working-directory: frontend
        run: npm run build
